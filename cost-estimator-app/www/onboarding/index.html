/* ===== tier 1 — inputs overridable from meta.theme (applyTheme() writes --t-* on <html>) ===== */
:root{
  --t-accent:#E1242A; --t-accent-rgb:225,36,42; --t-accent-light:#C11F24; --t-accent-soft:#FF5B5B;
  --t-secondary:#2E86AB; --t-secondary-rgb:46,134,171; --t-secondary-tint:#C0DBE6; --t-secondary-dark:#22647F;
  --t-bg:#0A0A0C; --t-font:"DM Sans"; --t-motif-alpha:.07; --t-glow:.55; --t-radius:14px;
  --bar-clear:88px;
}
/* ===== tier 2 — palettes (consume tier 1; light theme re-derives surfaces/text only) ===== */
:root,[data-theme="dark"]{
  --bg:var(--t-bg); --bg2:#0E0F13; --panel:#121216; --panel2:#18191F; --ghero:#1E1F24;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.15);
  --text:#F2F2F4; --muted:#9A9BA8; --kicker:rgba(242,242,244,.72);
  --accent:var(--t-accent); --accent-rgb:var(--t-accent-rgb); --accent-soft:var(--t-accent-soft);
  --secondary:var(--t-secondary); --secondary-rgb:var(--t-secondary-rgb); --secondary-tint:var(--t-secondary-tint);
  --glow1:rgba(var(--accent-rgb),calc(.62*var(--t-glow))); --glow2:rgba(var(--secondary-rgb),calc(.55*var(--t-glow)));
  --motif-ink:255,255,255; --glass:rgba(16,17,22,.62); --ghero-band:.92;
  --chip-bg:rgba(255,255,255,.07); --chip-tx:#D6D9E2; --ok:#2FBF71; --warn:#E8A13C;
  --shadow:0 10px 34px rgba(0,0,0,.45); --code:#0B0C10; --radius:var(--t-radius);
  --font:var(--t-font),-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
[data-theme="light"]{
  --bg:#F6F7F9; --bg2:#FFFFFF; --panel:#FFFFFF; --panel2:#EEF0F4; --ghero:#EEF0F4;
  --line:rgba(20,22,30,.10); --line2:rgba(20,22,30,.18);
  --text:#1A1D23; --muted:#4B5563; --kicker:rgba(26,29,35,.72);
  --accent:var(--t-accent-light); --accent-soft:var(--t-accent-light); --secondary-tint:var(--t-secondary-dark);
  --glow1:rgba(var(--accent-rgb),calc(.26*var(--t-glow))); --glow2:rgba(var(--secondary-rgb),calc(.22*var(--t-glow)));
  --motif-ink:20,22,30; --glass:rgba(255,255,255,.74); --ghero-band:.16;
  --chip-bg:#E9EDF4; --chip-tx:#31405C; --ok:#1E8F55; --warn:#B97A1E;
  --shadow:0 10px 30px rgba(30,40,60,.14); --code:#EEF0F4;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.55;
     -webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kicker{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.mutedk{color:var(--muted)}
svg.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}

/* ---------- background FX (glows + motif) — rendered inside #app, so printAll() drops it ---------- */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgfx::before{content:"";position:absolute;inset:0;
  background:radial-gradient(900px 900px at 88% -6%,var(--glow1) 0%,transparent 68%),
             radial-gradient(1000px 900px at 0% 106%,var(--glow2) 0%,transparent 68%)}
.bgfx::after{content:"";position:absolute;inset:-6% 0;opacity:var(--t-motif-alpha);
  transform:translateY(var(--py,0px));will-change:transform}
html[data-motif="none"] .bgfx::after{display:none}
html[data-motif="rings"] .bgfx::after{
  background:radial-gradient(circle at 84% 8%,transparent 519px,rgb(var(--motif-ink)) 520px,rgb(var(--motif-ink)) 521px,transparent 522px),
             radial-gradient(circle at 84% 8%,transparent 759px,rgb(var(--motif-ink)) 760px,rgb(var(--motif-ink)) 761px,transparent 762px),
             radial-gradient(circle at 84% 8%,transparent 1039px,rgb(var(--motif-ink)) 1040px,rgb(var(--motif-ink)) 1041px,transparent 1042px)}
html[data-motif="grid"] .bgfx::after{
  background-image:linear-gradient(rgb(var(--motif-ink)) 1px,transparent 1px),linear-gradient(90deg,rgb(var(--motif-ink)) 1px,transparent 1px);
  background-size:72px 72px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 25%,transparent 78%);mask-image:radial-gradient(ellipse at 50% 40%,#000 25%,transparent 78%)}

/* ---------- floating glass app bar ---------- */
.appbar{position:fixed;top:14px;left:0;right:0;z-index:50;display:flex;justify-content:space-between;
        align-items:center;gap:12px;padding:0 18px;pointer-events:none}
.appbar .spacer{flex:1}
.pill{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;background:var(--glass);
      border:1px solid var(--line2);border-radius:999px;padding:6px 8px;box-shadow:var(--shadow);
      -webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.pill{background:var(--bg2)}}
.pill.right{margin-left:auto}
.pill button{background:none;border:0;border-radius:999px;width:36px;height:36px;display:inline-flex;
             align-items:center;justify-content:center;color:var(--text);transition:background .18s,color .18s}
.pill button:hover{background:var(--panel2);color:var(--accent)}
.pill button.circ{background:var(--accent);color:#fff;width:32px;height:32px}
.pill button.circ:hover{background:var(--accent);color:#fff;filter:brightness(1.12)}
.pill button.primary{width:auto;padding:0 6px 0 12px;gap:10px;font-weight:700;font-size:13.5px}
.pill button.primary:hover{background:none;color:var(--text)}
.pill button.primary .circ{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;
                           display:inline-flex;align-items:center;justify-content:center;flex:0 0 30px}
.pill button.primary:hover .circ{filter:brightness(1.12)}
/* brand lockup */
.brandpill{padding:6px 18px 6px 12px;gap:12px;min-height:50px}
.brandpill img{height:22px;display:block}
.brandpill .borg{font-weight:800;font-size:15px;letter-spacing:.01em;white-space:nowrap}
.brandpill .bsep{width:1px;height:20px;background:var(--line2)}
.brandpill .bpow{font-size:13px;letter-spacing:.08em;color:var(--muted);white-space:nowrap}
.brandpill .bpow .pw{color:var(--text);font-weight:800;letter-spacing:.02em}
.brandpill .bpow .pw .acc{color:var(--accent)}
.brandpill .appicon{font-size:18px;line-height:1} .brandpill img.appicon{height:20px;width:20px;object-fit:contain}

/* ---------- WHY chapter rail ---------- */
.whynav{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:40;
        display:flex;flex-direction:column;gap:12px;align-items:flex-end}
.whynav .track{position:absolute;right:6px;top:6px;bottom:6px;width:1px;background:var(--line2)}
.whynav .track .fill{position:absolute;left:0;top:0;width:1px;height:var(--rail-fill,0px);background:var(--accent);
                     transition:height .3s ease}
.whynav .wn{display:flex;align-items:center;gap:10px;background:none;border:none;padding:0;position:relative;border-radius:999px}
.whynav .wn .wlab{background:var(--glass);border:1px solid var(--line);color:var(--muted);
                  font-size:11.5px;font-weight:700;letter-spacing:.02em;border-radius:999px;padding:6px 13px;
                  white-space:nowrap;transition:background .18s,color .18s,border-color .18s}
.whynav .wn .wdot{flex:0 0 13px;display:flex;justify-content:center}
.whynav .wn .wdot i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted);
                    background:var(--bg);display:block;transition:all .18s}
.whynav .wn:hover .wlab{color:var(--text);border-color:var(--line2)}
.whynav .wn.passed .wdot i{border-color:var(--accent)}
.whynav .wn.active .wlab{background:var(--text);color:var(--bg);border-color:var(--text)}

@media (max-width:1100px){.whynav{display:none}}

/* ---------- WHY view (full-screen snap deck) ---------- */
.why-scroll{position:relative;z-index:1;height:100svh;overflow-y:auto;scroll-snap-type:y mandatory}
.screen{height:100%;overflow-y:auto;scroll-snap-align:start;scroll-snap-stop:always;
        display:flex;flex-direction:column;position:relative}
.screen-inner{margin:auto;width:100%;max-width:1400px;padding:calc(var(--bar-clear) + 12px) clamp(26px,4vw,72px) 56px}
@media (min-width:1100px){.screen-inner{padding-right:max(clamp(26px,4vw,72px),240px)}}
/* .fx gates the enter animations to browsers with IntersectionObserver */
.fx .anim{opacity:0;transform:translateY(24px);
          transition:opacity .55s ease,transform .55s ease;
          transition-delay:calc(var(--i,0)*80ms)}
.fx .screen.in .anim{opacity:1;transform:translateY(0)}
.hero{padding:0}
.hero .kick{font-size:12.5px;font-weight:600;letter-spacing:.22em;color:var(--kicker);margin:0 0 30px}
.hero h1{font-size:clamp(46px,7.4vw,108px);line-height:.98;margin:0 0 30px;font-weight:700;letter-spacing:-.025em}
.hero h1 span{display:block}
.hero p{max-width:780px;font-size:clamp(17px,1.5vw,22px);color:var(--muted);margin:0;line-height:1.45}
.hero .what{margin-top:22px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);opacity:.8}
.scroll-hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;
             align-items:center;gap:8px;font-size:10.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;
             color:var(--muted);animation:hint 2.4s ease-in-out infinite}
.scroll-hint i{width:1px;height:44px;background:var(--muted);display:block}
@keyframes hint{0%,100%{opacity:.45}50%{opacity:1}}
.chapter{padding:0;border:none;margin:0}
.chapter .num{color:var(--kicker);font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;margin-bottom:20px}
.chapter h2{font-size:clamp(32px,4.8vw,66px);margin:0 0 18px;line-height:1.02;letter-spacing:-.022em;font-weight:700}
.chapter .intro{max-width:900px;color:var(--muted);font-size:clamp(15px,1.35vw,19px);margin-bottom:26px;line-height:1.5}
.cta-box{background:none;border:none;padding:0;text-align:center;box-shadow:none;margin:0}
.cta-box h2{font-size:clamp(38px,5.8vw,84px);margin:6px 0 16px;letter-spacing:-.025em;line-height:1}
.cta-box p{font-size:clamp(15px,1.3vw,18px);max-width:720px;margin:0 auto}
.s-cta .chapter .num{text-align:center}
.cta-box .go{margin-top:30px;background:var(--accent);color:#fff;border:none;border-radius:999px;
             padding:15px 14px 15px 34px;font-size:16px;font-weight:700;display:inline-flex;align-items:center;gap:14px;
             box-shadow:0 8px 28px rgba(var(--accent-rgb),.35);transition:filter .18s}
.cta-box .go .circ{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.18);display:inline-flex;
                   align-items:center;justify-content:center}
.cta-box .go:hover{filter:brightness(1.1)}
.cta-meta{margin-top:18px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ---------- blocks: divided-panel language (one bordered container, 1px dividers) ---------- */
.b-text{max-width:880px;font-size:clamp(15px,1.25vw,17.5px);margin:16px 0;color:var(--text)}
.b-text b{color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:0;margin:22px 0;
      border-top:1px solid var(--line);border-left:1px solid var(--line);border-radius:var(--radius);
      overflow:hidden;background:var(--panel)}
.grid.cols-1{--cols:1}.grid.cols-2{--cols:2}.grid.cols-3{--cols:3}.grid.cols-4{--cols:4}.grid.cols-5{--cols:5}.grid.cols-6{--cols:6}
.card{background:var(--panel);padding:24px 26px 26px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.stat .lab{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
.stat .val{font-size:46px;font-weight:700;color:var(--text);line-height:1.05;margin:12px 0 4px;letter-spacing:-.02em}
.stat .val small{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
.stat .txt{font-size:13.5px;color:var(--muted);margin-top:6px}
.stat .src{margin-top:14px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px;opacity:.85}
.lc .step{padding:24px 24px 26px}
.lc .step::before{counter-increment:lc;content:counter(lc,decimal-leading-zero);
                  display:block;font-size:30px;font-weight:300;color:var(--accent);margin-bottom:10px;line-height:1}
.lc{counter-reset:lc}
.lc .step h4{margin:0 0 6px;font-size:16px}
.lc .step p{margin:0;font-size:13px;color:var(--muted)}
.cap .chead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
            font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.cap .chead .cix{color:var(--accent)} .cap .chead .cbadge{color:var(--muted);text-align:right;letter-spacing:.08em}
.cap h4{margin:14px 0 6px;font-size:18px;letter-spacing:-.01em}
.cap p{margin:0;font-size:13.5px;color:var(--muted)}
.layer .kicker{letter-spacing:.14em}
.layer h4{margin:14px 0 8px;font-size:clamp(20px,1.8vw,26px);letter-spacing:-.015em;line-height:1.15}
.layer .ldesc{font-size:13.5px;color:var(--muted);margin:0 0 18px}
.layer ul{margin:0;padding:16px 0 0;list-style:none;border-top:1px solid var(--line)}
.layer li{font-size:13px;font-weight:600;padding:4px 0;display:flex;gap:10px;align-items:baseline}
.layer li::before{content:"";width:10px;height:2px;background:var(--accent);flex:0 0 10px;position:relative;top:-3px}
.strip{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));border:1px solid var(--line);
       border-radius:var(--radius);margin:14px 0 22px;background:var(--panel)}
.strip .sitem{padding:18px 22px;font-size:13.5px;color:var(--muted);border-left:1px solid var(--line)}
.strip .sitem:first-child{border-left:0} .strip .sitem.lead{color:var(--text);font-weight:700;font-size:15px}
.principle h4{margin:0 0 6px;font-size:16px;letter-spacing:-.01em} .principle p{margin:0;font-size:13.5px;color:var(--muted)}
.role .who{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.role p{margin:10px 0 0;font-size:14px}
.steps{margin:22px 0;padding:0;list-style:none;counter-reset:st;max-width:900px}
.steps li{counter-increment:st;display:grid;grid-template-columns:64px minmax(0,1fr);gap:0 8px;padding:24px 0;border-bottom:1px solid var(--line)}
.steps li::before{content:counter(st);font-size:34px;font-weight:300;color:var(--accent);line-height:1;padding-top:2px}
.steps h4{margin:0 0 4px;font-size:17px;letter-spacing:-.01em}
.steps .srole{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
              color:var(--accent);border-left:2px solid var(--accent);padding-left:9px;margin:6px 0 8px}
.steps p{margin:0;font-size:14px;color:var(--muted)}
.required{display:flex;gap:26px;background:rgba(var(--accent-rgb),.10);border:1px solid rgba(var(--accent-rgb),.28);
          border-left:3px solid var(--accent);border-radius:0 var(--radius) var(--radius) 0;padding:22px 26px;margin:22px 0;max-width:980px}
.required .tag{flex:0 0 auto;font-size:10.5px;font-weight:800;letter-spacing:.16em;color:var(--accent);padding-top:3px}
.required h4{margin:0 0 6px;font-size:16px} .required p{margin:0;font-size:14px}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0;
       border-top:2px solid var(--accent);border-left:1px solid var(--line);margin:22px 0;background:var(--panel)}
.tools .tool{padding:18px 18px 20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.tools h4{margin:0 0 6px;font-size:15px}
.tools p{margin:0;font-size:12.5px;color:var(--muted)}
.note{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:0 10px 10px 0;
      padding:14px 18px;font-size:13.5px;margin:18px 0;max-width:900px;color:var(--muted)}
.note b{color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0}
.chip{background:var(--chip-bg);color:var(--chip-tx);font-size:12.5px;font-weight:700;border:1px solid var(--line2);
      border-radius:999px;padding:6px 14px}
figure.shot{margin:22px 0} figure.shot img{max-width:100%;border-radius:12px;border:1px solid var(--line)}
figure.shot figcaption{font-size:12px;color:var(--muted);margin-top:6px}
code{background:var(--code);padding:2px 7px;border-radius:5px;font-size:.9em;font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
/* glance */
.glance{margin:24px 0}
.glance .gtitle{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.glance .gcells{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line)}
.gcell{padding:18px 24px 18px 0;border-bottom:1px solid var(--line);min-width:0}
.gcell:nth-child(2n){padding-left:24px;border-left:1px solid var(--line)}
.gcell .gl{font-weight:700;font-size:15px;margin-bottom:4px} .gcell .gt{font-size:14px;color:var(--muted)}
/* tabs */
.tabs{margin:24px 0}
.tabstrip{display:flex;align-items:stretch;gap:24px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:6px}
.tabstrip .tl{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);align-self:center;margin-right:6px}
.tabstrip button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted);
                 font-weight:700;font-size:14px;padding:15px 2px;transition:color .18s,border-color .18s}
.tabstrip button:hover{color:var(--text)}
.tabstrip button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabpane[hidden]{display:none}
/* video */
.video{margin:24px 0}
.vscreen{aspect-ratio:16/9;width:min(100%,900px,max(480px,calc((100svh - 470px)*1.7778)));border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#000;box-shadow:var(--shadow)}
.vscreen video,.vscreen iframe{width:100%;height:100%;display:block;border:0}
.video figcaption{font-size:13px;color:var(--muted);margin-top:10px}
.video .vlink{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:700;text-decoration:none;white-space:nowrap}
.video .vlink:hover{text-decoration:underline}
.video .vlink svg{width:13px;height:13px}
.video .vprint{display:none;font-size:12px;color:var(--muted);margin-top:8px}
.video .vprint img{max-width:100%;border-radius:12px;display:block;margin-bottom:6px}
.video .vnone{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:18px;font-size:13px}

/* ---------- GUIDE view ---------- */
.guide{position:relative;z-index:1;display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
.side{background:var(--bg2);border-right:1px solid var(--line);padding:26px 18px 40px;
      overflow-y:auto;position:sticky;top:0;height:100vh}
.prog .plabel{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;
              letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.prog .pbar{height:2px;background:var(--line2);margin:10px 0 8px;overflow:hidden}
.prog .pfill{height:100%;background:var(--accent);transition:width .3s}
.prog .pcount{font-size:12px;color:var(--text)}
.prog .pcaveat{font-size:10.5px;color:var(--muted);opacity:.8;margin-top:3px}
.scat{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
      color:var(--muted);margin:26px 0 8px;padding-top:18px;border-top:1px solid var(--line)}
.tree{position:relative}
.tree::before{content:"";position:absolute;left:11px;top:10px;bottom:10px;width:1px;background:var(--line2)}
.titem,.tgroup>.thead{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;
      color:var(--text);padding:6px 8px 6px 0;font-size:14px;text-align:left;border-radius:8px;position:relative;
      transition:background .18s}
.titem .dot,.tgroup>.thead .tw{flex:0 0 22px;height:22px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.titem .dot i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted);background:var(--bg2);
              display:block;box-shadow:0 0 0 4px var(--bg2)}
.tgroup>.thead .tw{width:22px;border-radius:50%;background:var(--bg2);border:1px solid var(--line2);color:var(--muted)}
.tgroup>.thead .tw svg{width:11px;height:11px}
.titem .bar,.tgroup>.thead .bar{width:3px;height:18px;border-radius:2px;background:var(--line2);flex:0 0 3px}
.titem .tlab,.tgroup>.thead .tlab{flex:1;min-width:0;padding:6px 0}
.titem .tnum{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;padding-left:12px;border-left:1px solid var(--line2);line-height:1}
.titem .tick{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.titem .tick svg{width:11px;height:11px;stroke-width:3}
.titem:hover,.tgroup>.thead:hover{background:var(--panel2)}
.titem.current{background:var(--panel2);font-weight:700}
.titem.current .bar,.titem.done .bar{background:var(--accent)}
.titem.current .dot i{border-color:var(--accent);background:var(--accent)}
.titem .opt{font-size:9px;font-weight:800;letter-spacing:.12em;color:var(--warn)}
.tgroup .tkids{display:none;margin-left:22px;position:relative}
.tgroup.open>.tkids{display:block}
.tkids .titem::before{content:"";position:absolute;left:-11px;top:50%;width:14px;height:1px;background:var(--line2)}
.tkids .titem .tnum{display:none}
.backwhy{display:block;margin:26px 0 0;font-size:12.5px;color:var(--muted);text-decoration:none}
.backwhy:hover{color:var(--accent)}

.gmain{padding:30px 44px 90px;max-width:1240px}
/* section header, hero style (first section) */
.ghero{position:relative;overflow:hidden;background:var(--ghero);border:1px solid var(--line);border-radius:var(--radius);
       padding:44px 52px 46px;box-shadow:var(--shadow);margin-bottom:28px}
.ghero::before{content:"";position:absolute;inset:0;background:var(--accent);opacity:var(--ghero-band);
               clip-path:polygon(70% 0,100% 0,100% 100%,50% 100%)}
.ghero::after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;right:-70px;top:-130px;
              background:rgba(255,255,255,.16)}
.ghero>*{position:relative;z-index:1}
.ghero .gk{display:flex;align-items:center;gap:12px}
.ghero .gk::before{content:"";width:2px;height:18px;background:var(--accent)}
.ghero h1{font-size:clamp(30px,4vw,58px);line-height:1.02;margin:18px 0 18px;font-weight:700;letter-spacing:-.022em;max-width:820px}
.ghero .intro{max-width:760px;color:var(--text);opacity:.86;font-size:clamp(15px,1.3vw,19px);margin:0;line-height:1.45}
.ghero .chip{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.28);color:var(--text)}
[data-theme="light"] .ghero .chip{background:#fff;border-color:var(--line2);color:var(--text)}
/* section header, plain style with optional aside */
.ghead{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;padding:58px 0 30px;border-bottom:1px solid var(--line);margin-bottom:30px}
.ghead.noaside{grid-template-columns:1fr}
.ghead .gk{display:flex;align-items:center;gap:12px;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--kicker)}
.ghead .gk::before{content:"";width:2px;height:16px;background:var(--accent)}
.ghead h1{font-size:clamp(34px,4.6vw,66px);line-height:1;margin:16px 0 14px;font-weight:700;letter-spacing:-.025em}
.ghead .intro{max-width:760px;color:var(--muted);font-size:clamp(15px,1.25vw,18px);margin:0}
.gaside{border-left:1px solid var(--line);padding-left:30px;align-self:start}
.gaside h4{margin:12px 0 8px;font-size:21px;letter-spacing:-.015em;line-height:1.15}
.gaside p{margin:0;font-size:13px;color:var(--muted)}
.gaside .acta{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--accent);color:#fff;border:0;
              border-radius:999px;padding:9px 16px;font-size:13px;font-weight:700;text-decoration:none}
.gmeta{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:16px}
.checkpoint{margin-top:34px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px}
.checkpoint .cphead{display:flex;justify-content:space-between;font-size:10.5px;font-weight:800;
                    letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.checkpoint label{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;cursor:pointer}
.checkpoint input{width:18px;height:18px;accent-color:var(--accent);margin-top:2px}
.checkpoint.confirmed{border-color:var(--accent)}
.checkpoint.confirmed .cphead .cpn{color:var(--accent)}
.gfoot{margin-top:28px;border-top:1px solid var(--line);padding-top:14px;font-size:11.5px;color:var(--muted);line-height:1.7}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:30px}
.pager button{background:var(--panel);border:1px solid var(--line);color:var(--text);
              border-radius:var(--radius);padding:14px 20px;font-size:13.5px;max-width:46%;text-align:left;transition:border-color .18s}
.pager button:hover{border-color:var(--accent)}
.pager button .pk{display:block;font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--accent);
                  text-transform:uppercase;margin-bottom:4px}
.pager button:disabled{opacity:.35;cursor:default}

@media (max-width:1200px){.grid.cols-3,.grid.cols-4,.grid.cols-5,.grid.cols-6{--cols:2}.ghead{grid-template-columns:1fr}
  .gaside{border-left:0;border-top:1px solid var(--line);padding:18px 0 0}}
@media (max-width:860px){
  :root{--bar-clear:74px}
  .appbar{top:10px;padding:0 10px}
  .brandpill .bpow{display:none}
  .guide{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line);padding-top:var(--bar-clear)}
  .gmain{padding:24px 20px 80px}
  .why-scroll{height:auto;overflow:visible;scroll-snap-type:none}
  .screen{height:auto;overflow:visible;min-height:70svh}
  .scroll-hint{display:none}
  .grid,.grid.cols-2{--cols:1}
  .strip{grid-template-columns:1fr}.strip .sitem{border-left:0;border-top:1px solid var(--line)}.strip .sitem:first-child{border-top:0}
  .glance .gcells{grid-template-columns:1fr}.gcell:nth-child(2n){padding-left:0;border-left:0}
  .steps li{grid-template-columns:44px minmax(0,1fr)}.steps li::before{font-size:26px}
}
@media (prefers-reduced-motion:reduce){
  .fx .anim{transition:none!important;opacity:1!important;transform:none!important}
  .scroll-hint{animation:none}
  .whynav .track .fill{transition:none}
  .bgfx::after{transform:none!important}
}
@media print{
  .appbar,.side,.pager,.cta-box .go,.whynav,.bgfx,.tabstrip,.scroll-hint,.gaside .acta,.vscreen{display:none!important}
  .why-scroll{height:auto;overflow:visible;scroll-snap-type:none}
  .screen{height:auto;overflow:visible}
  .screen-inner{padding-top:20px}
  .fx .anim{opacity:1!important;transform:none!important;transition:none!important}
  body{background:#fff;color:#111}
  .guide{display:block}

    }
  }
}

<div id="app"></div>

<script>
(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById("onboarding-data").textContent);
  var META = DATA.meta || {};
  var KEY = META.storage_key || "app-onboarding";
  var root = document.getElementById("app");
  var REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  /* ---------- storage ---------- */
  function store(k, v){ try{ localStorage.setItem(KEY+"."+k, JSON.stringify(v)); }catch(e){} }
  function load(k, d){ try{ var v = localStorage.getItem(KEY+"."+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } }

  /* ---------- theme: meta.theme → --t-* inputs on <html> (tier 1), palettes resolve per data-theme (tier 2) ---------- */
  function hexRgb(h){
    var m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(h||"").trim()); if(!m) return null;
    var s = m[1].length===3 ? m[1].replace(/./g, "$&$&") : m[1];
    return [0,2,4].map(function(i){ return parseInt(s.substr(i,2),16); });
  }
  function rgbHex(rgb){ return "#"+rgb.map(function(c){ c = Math.max(0,Math.min(255,Math.round(c))); return ("0"+c.toString(16)).slice(-2); }).join(""); }
  function mix(rgb, to, t){ return rgb.map(function(c,i){ return c + (to[i]-c)*t; }); }
  function applyTheme(){
    var T = META.theme || {}, st = document.documentElement.style, bad = [];
    function color(key, cb){ if(T[key]==null) return; var rgb = hexRgb(T[key]); if(rgb) cb(rgb); else bad.push(key); }
    color("accent", function(a){
      st.setProperty("--t-accent", rgbHex(a)); st.setProperty("--t-accent-rgb", a.join(","));
      st.setProperty("--t-accent-light", rgbHex(mix(a,[0,0,0],.14)));
      if(T.accent_soft==null) st.setProperty("--t-accent-soft", rgbHex(mix(a,[255,255,255],.22)));
    });
    color("accent_soft", function(a){ st.setProperty("--t-accent-soft", rgbHex(a)); });
    color("secondary", function(s){
      st.setProperty("--t-secondary", rgbHex(s)); st.setProperty("--t-secondary-rgb", s.join(","));
      st.setProperty("--t-secondary-tint", rgbHex(mix(s,[255,255,255],.7)));
      st.setProperty("--t-secondary-dark", rgbHex(mix(s,[0,0,0],.25)));
    });
    color("bg", function(b){ st.setProperty("--t-bg", rgbHex(b)); });
    if(typeof T.motif_opacity==="number") st.setProperty("--t-motif-alpha", Math.max(0, Math.min(.3, T.motif_opacity)));
    if(typeof T.glow_strength==="number") st.setProperty("--t-glow", Math.max(0, Math.min(1, T.glow_strength)));
    if(typeof T.radius==="string" && /^\d+(\.\d+)?(px|rem|em)$/.test(T.radius)) st.setProperty("--t-radius", T.radius);
    if(T.font_family){
      st.setProperty("--t-font", T.font_family==="system" ? "-apple-system" : JSON.stringify(String(T.font_family)));
    }
    var motif = /^(rings|nodes|grid|none)$/.test(T.motif||"") ? T.motif : (T.motif ? (bad.push("motif"), "rings") : "rings");
    document.documentElement.setAttribute("data-motif", motif);
    if(bad.length && window.console) console.warn("onboarding: ignored invalid meta.theme values:", bad.join(", "));
  }
  function initTheme(){
    var q = new URLSearchParams(location.search).get("theme");   // ?theme=light|dark → one-off, not persisted
    var t = (q==="light"||q==="dark") ? q : load("theme", null);
    if(!t) t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t);
  }
  function setFavicon(){
    var href = META.favicon ||
      (META.favicon_emoji ? "data:image/svg+xml,"+encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">'+
        '<text y="0.9em" font-size="88">'+META.favicon_emoji+"</text></svg>") : null);
    if(!href) return;
    var l = document.querySelector('link[rel="icon"]');
    if(!l){ l = document.createElement("link"); l.rel = "icon"; document.head.appendChild(l); }
    l.href = href;
  }
  function toggleTheme(){
    var t = document.documentElement.getAttribute("data-theme")==="dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t);
    store("theme", t);
    var b = document.getElementById("themeBtn"); if(b) b.innerHTML = ico(t==="dark" ? "moon" : "sun");
  }

  /* ---------- helpers ---------- */
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
  function pad2(n){ return (n<10?"0":"")+n; }
  var ICONS = {   /* Lucide (ISC) path data, 24px viewBox */
    left:'<path d="m15 18-6-6 6-6"/>', right:'<path d="m9 18 6-6-6-6"/>',
    download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',
    reset:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
    moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
    sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
    check:'<path d="M20 6 9 17l-5-5"/>', plus:'<path d="M5 12h14"/><path d="M12 5v14"/>', minus:'<path d="M5 12h14"/>'
  };
  function ico(name){ return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[name]||"")+"</svg>"; }
  var TOKENS = { text:"var(--text)", muted:"var(--muted)", accent:"var(--accent)", accent_soft:"var(--accent-soft)",
                 secondary:"var(--secondary)", secondary_tint:"var(--secondary-tint)" };
  function taglineColor(i){

    if(TOKENS[c]) return TOKENS[c];

  function bgfxHtml(){ return '<div class="bgfx" id="bgfx" aria-hidden="true"></div>'; }

  /* ---------- guide model ---------- */
  var GUIDE = DATA.guide || null;
  var ORDER = [];             // flattened section ids: tree leaves then practical guides
  var NUM = {};               // section id → "02" (01 is the first section)
  (function flatten(){
    if(!GUIDE) return;
    (function walk(nodes){ (nodes||[]).forEach(function(n){
      if(n.section) ORDER.push(n.section);
      if(n.children) walk(n.children);
    }); })(GUIDE.tree);
    (GUIDE.practical_guides||[]).forEach(function(n){ if(n.section) ORDER.push(n.section); });
    ORDER.forEach(function(id, i){ NUM[id] = pad2(i+1); });
  })();
  function checkpointIds(){
    return ORDER.filter(function(id){ var s = GUIDE.sections[id]; return s && s.checkpoint; });
  }
  function doneIds(){ return load("done", []); }
  function isDone(id){ return doneIds().indexOf(id) !== -1; }
  function setDone(id, v){
    var d = doneIds().filter(function(x){ return x!==id; });
    if(v) d.push(id);
    store("done", d);
  }
  var TABS = load("tabs", {});   // remembered tab per "sectionId:blockIndex" — survives render(); Reset leaves it alone

  /* ---------- router ---------- */
  function currentRoute(){
    var q = new URLSearchParams(location.search);
    var view = q.get("view")==="guide" ? "guide" : "why";
    var section = q.get("section");
    if(view==="guide" && (!section || !GUIDE || !GUIDE.sections[section])) section = ORDER[0];
    return { view: view, section: section };
  }
  function nav(view, section, replace){
    var q = new URLSearchParams();
    if(view==="guide"){ q.set("view","guide"); if(section) q.set("section", section); }
    var url = location.pathname + (q.toString() ? "?"+q.toString() : "");
    if(replace) history.replaceState(null,"",url); else history.pushState(null,"",url);
    render();
    window.scrollTo(0,0);
  }
  window.addEventListener("popstate", function(){
    var r = currentRoute();
    // hash-only movement inside the Why deck: scroll, don't re-render
    if(r.view==="why" && document.getElementById("whyScroll") && location.hash &&
       document.getElementById(location.hash.slice(1))){
      scrollToScreen(location.hash.slice(1), true);
      return;
    }
    render();
  });

  /* ---------- block renderers ----------
     renderBlocks(blocks, animStart, ctx): animStart (number) wraps each top-level block in a staggered
     .anim; ctx = {sec, print, inTabs}. Block renderers return ONE string and never add .anim themselves. */
  function cols(n, max){ return " cols-"+Math.max(1, Math.min(max, n||1)); }
  function renderBlocks(blocks, animStart, ctx){
    var out = "";
    var ai = (typeof animStart === "number") ? animStart : null;
    ctx = ctx || {};
    (blocks||[]).forEach(function(b, bi){
      var p = "", items = b.items||[];
      switch(b.type){
        case "text": p = '<div class="b-text">'+(b.html||"")+"</div>"; break;
        case "stats":
          p = '<div class="grid'+cols(items.length,3)+'">'+items.map(function(s){
            return '<div class="card stat"><div class="lab">'+esc(s.label)+'</div>'+
              '<div class="val">'+esc(s.value)+(s.unit?' <small>'+esc(s.unit)+'</small>':'')+'</div>'+
              '<div class="txt">'+esc(s.text||"")+'</div>'+
              '<div class="src">Source: '+esc(s.source||"MISSING — add one")+'</div></div>';
          }).join("")+"</div>"; break;
        case "lifecycle":
          p = '<div class="grid lc'+cols(items.length,6)+'">'+items.map(function(s){
            return '<div class="card step"><h4>'+esc(s.title)+'</h4><p>'+esc(s.text||"")+'</p></div>';
          }).join("")+"</div>"; break;
        case "capabilities":
          p = '<div class="grid'+cols(items.length,3)+'">'+items.map(function(c,i){
            return '<div class="card cap"><div class="chead"><span class="cix">'+pad2(i+1)+' · '+esc(c.category||"")+
              '</span><span class="cbadge">'+esc(c.badge||"")+'</span></div>'+
              '<h4>'+esc(c.title)+'</h4><p>'+esc(c.text||"")+'</p></div>';
          }).join("")+"</div>"; break;
        case "layers":
          p = '<div><div class="grid'+cols(items.length,3)+'">'+items.map(function(l){
            return '<div class="card layer"><div class="kicker">'+esc(l.kicker||"")+'</div><h4>'+esc(l.title)+'</h4>'+
              (l.text?'<p class="ldesc">'+esc(l.text)+'</p>':'')+
              '<ul>'+(l.bullets||[]).map(function(x){ return "<li>"+esc(x)+"</li>"; }).join("")+"</ul></div>";
          }).join("")+"</div>"+
          (b.summary && b.summary.length ? '<div class="strip" style="--n:'+b.summary.length+'">'+
            b.summary.map(function(s,i){ return '<div class="sitem'+(i===0?" lead":"")+'">'+esc(s)+"</div>"; }).join("")+"</div>" : "")+
          "</div>"; break;
        case "principles":
          p = '<div class="grid'+cols(items.length,2)+'">'+items.map(function(pr){
            return '<div class="card principle"><h4>'+esc(pr.title)+'</h4><p>'+esc(pr.text||"")+'</p></div>';
          }).join("")+"</div>"; break;
        case "roles":
          p = '<div class="grid'+cols(items.length,3)+'">'+items.map(function(r){
            return '<div class="card role"><div class="who">'+esc(r.role)+'</div><p>'+esc(r.text||"")+'</p></div>';
          }).join("")+"</div>"; break;
        case "steps":
          p = '<ol class="steps">'+items.map(function(s){
            return '<li><div><h4>'+esc(s.title)+'</h4>'+(s.role?'<div class="srole">'+esc(s.role)+'</div>':'')+
              '<p>'+(s.text||"")+'</p></div></li>';
          }).join("")+"</ol>"; break;
        case "required":

                 '</h4><p>'+(b.text||"")+"</p></div></div>"; break;
        case "tools":
          p = '<div class="tools">'+items.map(function(t){
            return '<div class="tool"><h4>'+esc(t.name)+'</h4><p>'+esc(t.text||"")+'</p></div>';
          }).join("")+"</div>"; break;
        case "note": p = '<div class="note">'+(b.html||"")+"</div>"; break;
        case "image":
          p = '<figure class="shot"><img src="'+esc(b.src)+'" alt="'+esc(b.alt||"")+'"/>'+
                 (b.caption?'<figcaption>'+esc(b.caption)+"</figcaption>":"")+"</figure>"; break;
        case "glance":
          p = '<div class="glance">'+(b.title?'<div class="gtitle">'+esc(b.title)+'</div>':'')+'<div class="gcells">'+
            items.slice(0,4).map(function(g){
              return '<div class="gcell"><div class="gl">'+esc(g.label)+'</div><div class="gt">'+(g.html||esc(g.text||""))+"</div></div>";
            }).join("")+"</div></div>"; break;
        case "tabs":
          if(ctx.inTabs){ if(window.console) console.warn("onboarding: nested tabs are not supported — block ignored"); break; }
          var key = (ctx.sec||"x")+":"+bi, act = ctx.print ? -1 : (TABS[key]||0);
          if(act >= items.length) act = 0;
          p = '<div class="tabs" data-key="'+esc(key)+'"><div class="tabstrip" role="tablist">'+

            items.map(function(t,i){ return '<button role="tab" aria-selected="'+(i===act)+'" data-ix="'+i+'">'+esc(t.label)+"</button>"; }).join("")+
            "</div>"+items.map(function(t,i){
              return '<div class="tabpane" role="tabpanel" data-label="'+esc(t.label)+'"'+((ctx.print||i===act)?"":" hidden")+">"+
                renderBlocks(t.blocks, null, {sec:ctx.sec, print:ctx.print, inTabs:true})+"</div>";
            }).join("")+"</div>"; break;
        case "video":

          var mime = b.src ? ({mp4:"video/mp4",m4v:"video/mp4",webm:"video/webm",mov:"video/quicktime",ogv:"video/ogg"}[String(b.src).split(".").pop().toLowerCase()]||"") : "";
          var player = emb ?
            '<iframe src="'+esc(emb)+'" title="'+esc(b.title||"Video")+'" loading="lazy" allowfullscreen '+
            'allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>' :
            (b.src ? '<video controls preload="metadata" playsinline'+(b.poster?' poster="'+esc(b.poster)+'"':'')+' title="'+esc(b.title||"")+'">'+
                     '<source src="'+esc(b.src)+'"'+(mime?' type="'+mime+'"':'')+'/>Your browser cannot play this video.</video>' : "");
          var wlink = (b.link && /^https:\/\//i.test(b.link)) ? b.link : null;   // share/watch URL: always-works fallback

          p = '<figure class="video">'+
            (player ? '<div class="vscreen'+(emb?" embed":"")+'">'+player+"</div>" : '<div class="vnone">Video not configured — add <code>src</code> or <code>embed_url</code>.</div>')+
            (b.caption||b.duration||wlink ? '<figcaption>'+esc(b.caption||"")+(b.duration?(b.caption?" · ":"")+esc(b.duration):"")+
              (wlink ? (b.caption||b.duration?" · ":"")+'<a class="vlink" href="'+esc(wlink)+'" target="_blank" rel="noopener">'+esc(b.link_label||"Open in Stream")+" "+ico("right")+"</a>" : "")+"</figcaption>" : "")+
            '<div class="vprint">'+(b.poster?'<img src="'+esc(b.poster)+'" alt=""/>':'')+
            '<span>Video: '+esc(b.title||"")+(link?" — "+esc(link):"")+"</span></div></figure>"; break;
      }
      if(ai !== null && p) p = '<div class="anim" style="--i:'+(ai++)+'">'+p+"</div>";

  }
  function chipsHtml(chips){
    if(!chips || !chips.length) return "";

  }
  function wireTabs(){
    Array.prototype.forEach.call(root.querySelectorAll(".tabs"), function(t){
      var key = t.getAttribute("data-key"), btns = t.querySelectorAll('.tabstrip [role="tab"]'), panes = t.querySelectorAll(":scope > .tabpane");

        b.onclick = function(){
          var ix = +b.getAttribute("data-ix");
          Array.prototype.forEach.call(btns, function(x,i){ x.setAttribute("aria-selected", i===ix ? "true" : "false"); });
          Array.prototype.forEach.call(panes, function(x,i){ if(i===ix) x.removeAttribute("hidden"); else x.setAttribute("hidden",""); });
          TABS[key] = ix; store("tabs", TABS);
        };
      });
    });
  }

  /* ---------- app bar (floating glass pills) ---------- */
  function brandHtml(){
    var b = META.brand;
    var icon = META.favicon ? '<img class="appicon" src="'+esc(META.favicon)+'" alt=""/>' :
               (META.favicon_emoji ? '<span class="appicon">'+esc(META.favicon_emoji)+"</span>" : "");
    if(!b) return '<span class="pill brandpill">'+icon+'<span class="borg">'+esc(META.app||"")+"</span></span>";
    var pw = "";
    if(b.powered_by){
      var t = b.powered_by, a = b.powered_by_accent, ix = a ? t.lastIndexOf(a) : -1;
      pw = '<span class="bpow">Powered by <span class="pw">'+
        (ix>=0 ? esc(t.slice(0,ix))+'<span class="acc">'+esc(t.slice(ix))+"</span>" : esc(t))+
        "</span></span>";
    }
    var mark = (b.logo_src ? '<img src="'+esc(b.logo_src)+'" alt="'+esc(b.org||"logo")+'"/>' : "")+
               (b.org ? '<span class="borg">'+esc(b.org)+"</span>" : "");
    return '<span class="pill brandpill">'+(mark||icon)+(mark&&pw?'<span class="bsep"></span>':"")+pw+"</span>";
  }
  function appbar(route){
    var inGuide = route.view==="guide", dark = document.documentElement.getAttribute("data-theme")==="dark";
    var ctl = '<span class="pill right">'+
      (inGuide ? '<button class="circ" id="backBtn" title="Previous section" aria-label="Previous section">'+ico("left")+"</button>" : "")+
      '<button id="printBtn" title="Print / save as PDF (all guide sections)" aria-label="Print or save as PDF">'+ico("download")+"</button>"+
      (GUIDE && !inGuide ? '<button class="primary" id="startBtn"><span>'+esc((DATA.why&&DATA.why.cta&&DATA.why.cta.button)||"Start onboarding")+'</span><span class="circ">'+ico("right")+"</span></button>" : "")+
      (inGuide ? '<button id="resetBtn" title="Reset progress" aria-label="Reset progress">'+ico("reset")+"</button>" : "")+
      "</span>"+
      '<span class="pill"><button id="themeBtn" title="Toggle dark / light theme" aria-label="Toggle dark or light theme">'+ico(dark?"moon":"sun")+"</button></span>";
    return '<header class="appbar">'+(inGuide ? '<span class="spacer"></span>' : brandHtml())+ctl+"</header>";
  }
  function wireAppbar(route){
    var s = document.getElementById("startBtn"); if(s) s.onclick = function(){ nav("guide", ORDER[0]); };
    var t = document.getElementById("themeBtn"); if(t) t.onclick = toggleTheme;
    var p = document.getElementById("printBtn"); if(p) p.onclick = printAll;
    var r = document.getElementById("resetBtn"); if(r) r.onclick = function(){
      if(confirm("Reset onboarding progress in this browser?")){ store("done", []); render(); }
    };
    var b = document.getElementById("backBtn"); if(b) b.onclick = function(){
      var ix = ORDER.indexOf(route && route.section);
      if(ix > 0) nav("guide", ORDER[ix-1]); else nav("why");
    };
  }

  /* ---------- WHY view ---------- */
  var whySpy = null, whyAnim = null;   // IntersectionObservers, torn down on re-render
  function titleCase(s){ s = String(s||""); return s.charAt(0).toUpperCase()+s.slice(1).toLowerCase(); }
  function scrollToScreen(id, smooth){
    var t = document.getElementById(id);
    if(t) t.scrollIntoView({behavior: (smooth && !REDUCED) ? "smooth" : "auto", block:"start"});
  }
  function setRail(activeId){
    var btns = root.querySelectorAll(".whynav .wn"), fill = root.querySelector(".whynav .track .fill"), track = root.querySelector(".whynav .track");
    var ix = -1;
    Array.prototype.forEach.call(btns, function(b,i){
      var on = b.getAttribute("data-target")===activeId; if(on) ix = i;
      b.classList.toggle("active", on);
    });
    Array.prototype.forEach.call(btns, function(b,i){ b.classList.toggle("passed", ix>=0 && i<ix); });
    if(fill && track && ix>=0){
      var a = btns[ix]; fill.style.setProperty("--rail-fill", Math.max(0, a.offsetTop + a.offsetHeight/2 - track.offsetTop)+"px");
    }
  }
  function renderWhy(){
    var W = DATA.why || {chapters:[]};
    var h = bgfxHtml()+appbar({view:"why"});
    var tag = META.tagline || [];
    var screens = '<section class="screen s-hero" id="why-start"><div class="screen-inner">'+
      '<div class="hero"><div class="kick anim" style="--i:0">Why '+esc(META.app||"")+'?</div>'+
      '<h1 class="anim" style="--i:1">'+
      tag.map(function(t,i){ return '<span style="color:'+taglineColor(i)+'">'+esc(t)+"</span>"; }).join("")+
      '</h1><p class="anim" style="--i:2">'+esc(META.subtitle||"")+"</p>"+
      (META.what?'<div class="what anim" style="--i:3">'+esc(META.what)+"</div>":"")+"</div></div>"+
      (W.scroll_hint!==false ? '<div class="scroll-hint"><span>'+esc(W.scroll_hint||"See why")+"</span><i></i></div>" : "")+
      "</section>";
    var navItems = [{ id: "why-start", label: "Why "+(META.app||"")+"?" }];
    (W.chapters||[]).forEach(function(c, i){
      var sid = "why-"+(c.id||("ch"+i));
      navItems.push({ id: sid, label: c.nav_label || titleCase(c.kicker||("Chapter "+(i+1))) });
      screens += '<section class="screen" id="'+esc(sid)+'"><div class="screen-inner"><div class="chapter">'+
        '<div class="num anim" style="--i:0">'+pad2(i+1)+' · '+esc(c.kicker||"")+'</div>'+
        '<h2 class="anim" style="--i:1">'+esc(c.headline||"")+"</h2>"+
        (c.intro?'<div class="intro anim" style="--i:2">'+esc(c.intro)+"</div>":"")+
        renderBlocks(c.blocks, 3, {sec:sid})+"</div></div></section>";
    });
    if(W.cta && GUIDE){
      var n = (W.chapters||[]).length+1;
      navItems.push({ id: "why-begin", label: W.cta.button || "Start onboarding" });
      screens += '<section class="screen s-cta" id="why-begin"><div class="screen-inner">'+
        '<div class="chapter"><div class="num anim" style="--i:0">'+pad2(n)+' · '+esc(W.cta.kicker||"BEFORE YOU BEGIN")+'</div></div>'+
        '<div class="cta-box anim" style="--i:1"><h2>'+esc(W.cta.headline||"")+"</h2>"+
        '<p class="mutedk">'+esc(W.cta.intro||"")+"</p>"+
        '<button class="go" id="ctaGo"><span>'+esc(W.cta.button||"Start onboarding")+'</span><span class="circ">'+ico("right")+"</span></button>"+
        '<div class="cta-meta">'+(META.est_minutes_guide?("Approximately "+META.est_minutes_guide+" minutes · "):"")+
        "Progress is saved in this browser</div></div></div></section>";
    }
    h += '<div class="why-scroll" id="whyScroll">'+screens+"</div>";
    h += '<nav class="whynav" aria-label="Chapters"><span class="track"><i class="fill"></i></span>'+
      navItems.map(function(it){
        return '<button class="wn" data-target="'+esc(it.id)+'"><span class="wlab">'+esc(it.label)+
               '</span><span class="wdot"><i></i></span></button>';
      }).join("")+"</nav>";
    root.innerHTML = h;
    wireAppbar({view:"why"});
    wireTabs();
    var g = document.getElementById("ctaGo"); if(g) g.onclick = function(){ nav("guide", ORDER[0]); };
    Array.prototype.forEach.call(root.querySelectorAll(".whynav .wn"), function(b){
      b.onclick = function(){
        var id = b.getAttribute("data-target");
        history.pushState(null, "", "#"+id);
        scrollToScreen(id, true);
      };
    });
    if(whySpy) whySpy.disconnect();
    if(whyAnim) whyAnim.disconnect();
    var scroller = document.getElementById("whyScroll"), bg = document.getElementById("bgfx");
    if(window.IntersectionObserver){
      scroller.classList.add("fx");   // gates enter animations to observer-capable browsers
      whySpy = new IntersectionObserver(function(entries){
        entries.forEach(function(e){
          if(!e.isIntersecting) return;
          var id = e.target.id;
          setRail(id);
          if(location.hash !== "#"+id) history.replaceState(null, "", "#"+id);
        });
      }, { root: scroller, rootMargin: "-45% 0px -45% 0px" });
      whyAnim = new IntersectionObserver(function(entries){
        entries.forEach(function(e){ e.target.classList.toggle("in", e.isIntersecting); });
      }, { root: scroller, threshold: 0.25 });
      navItems.forEach(function(it){
        var t = document.getElementById(it.id);
        if(t){ whySpy.observe(t); whyAnim.observe(t); }
      });
    }
    if(!REDUCED && bg){   // gentle parallax on the motif layer (transform only)
      var ticking = false;
      scroller.addEventListener("scroll", function(){
        if(ticking) return; ticking = true;
        requestAnimationFrame(function(){ bg.style.setProperty("--py", (-scroller.scrollTop*0.05)+"px"); ticking = false; });
      }, {passive:true});
    }
    var startId = (location.hash && document.getElementById(location.hash.slice(1))) ? location.hash.slice(1) : "why-start";
    if(startId!=="why-start") scrollToScreen(startId, false);
    setRail(startId);
  }

  /* ---------- GUIDE view ---------- */
  function progressHtml(){
    var cps = checkpointIds(), done = doneIds().filter(function(id){ return cps.indexOf(id)!==-1; });
    var pct = cps.length ? Math.round(100*done.length/cps.length) : 0;
    return '<div class="prog"><div class="plabel"><span>Your progress</span><span>'+pct+"%</span></div>"+
      '<div class="pbar"><div class="pfill" style="width:'+pct+'%"></div></div>'+
      '<div class="pcount">'+done.length+" of "+cps.length+" sections complete</div>"+
      '<div class="pcaveat">Saved in this browser only</div></div>';
  }
  function treeHtml(nodes, current){
    return (nodes||[]).map(function(n){
      if(n.children){
        var open = containsCurrent(n, current) ? " open" : "";
        return '<div class="tgroup'+open+'"><button class="thead" aria-expanded="'+(open?"true":"false")+'"><span class="tw">'+ico(open?"minus":"plus")+"</span>"+
          '<span class="bar"></span><span class="tlab">'+esc(n.label)+"</span></button><div class=\"tkids\">"+treeHtml(n.children, current)+"</div></div>";
      }
      var done = n.section && isDone(n.section) && GUIDE.sections[n.section] && GUIDE.sections[n.section].checkpoint;
      return '<button class="titem'+(n.section===current?" current":"")+(done?" done":"")+'" data-sec="'+esc(n.section)+'"'+
        (n.section===current?' aria-current="page"':"")+'>'+
        '<span class="dot"><i></i></span><span class="bar"></span><span class="tlab">'+esc(n.label)+"</span>"+
        (n.optional?'<span class="opt">OPTIONAL</span>':"")+
        (done?'<span class="tick" title="Confirmed">'+ico("check")+"</span>":'<span class="tnum">'+(NUM[n.section]||"")+"</span>")+"</button>";
    }).join("");
  }
  function containsCurrent(node, current){
    if(node.section===current) return true;
    return (node.children||[]).some(function(k){ return containsCurrent(k, current); });
  }
  function asideHtml(a, inline){
    if(!a) return "";
    var cta = a.cta && a.cta.label ? '<a class="acta" href="'+esc(a.cta.href||"#")+'"'+(/^https?:/i.test(a.cta.href||"")?' target="_blank" rel="noopener"':"")+'>'+esc(a.cta.label)+ico("right")+"</a>" : "";
    return '<aside class="gaside'+(inline?" inline":"")+'">'+(a.kicker?'<div class="kicker">'+esc(a.kicker)+"</div>":"")+
      (a.title?"<h4>"+esc(a.title)+"</h4>":"")+(a.html||a.text?"<p>"+(a.html||esc(a.text))+"</p>":"")+cta+"</aside>";
  }
  function sectionHtml(id, forPrint){
    var s = GUIDE.sections[id]; if(!s) return "";
    var confirmed = isDone(id);
    var heroStyle = s.hero===true || (s.hero!==false && ORDER[0]===id && !s.aside);
    var meta = (s.minutes?'<div class="gmeta">About '+s.minutes+" minute"+(s.minutes>1?"s":"")+"</div>":"");
    var head;
    if(heroStyle){
      head = '<div class="ghero"><div class="gk kicker">'+esc(s.kicker||"")+'</div>'+
        "<h1>"+esc(s.title||id)+"</h1>"+
        (s.intro?'<p class="intro">'+esc(s.intro)+"</p>":"")+chipsHtml(s.chips)+meta+"</div>"+
        (s.aside ? asideHtml(s.aside, true) : "");
    } else {
      head = '<div class="ghead'+(s.aside?"":" noaside")+'"><div><div class="gk">'+esc(s.kicker||"")+'</div>'+
        "<h1>"+esc(s.title||id)+"</h1>"+
        (s.intro?'<p class="intro">'+esc(s.intro)+"</p>":"")+chipsHtml(s.chips)+meta+"</div>"+
        asideHtml(s.aside)+"</div>";
    }
    var h = '<article class="'+(forPrint?"print-section":"")+'">'+head+renderBlocks(s.blocks, undefined, {sec:id, print:!!forPrint});
    if(s.checkpoint){
      h += '<div class="checkpoint'+(confirmed?" confirmed":"")+'" id="cp">'+
        '<div class="cphead"><span>Completion checkpoint</span><span class="cpn">'+(confirmed?"1":"0")+" / 1 confirmed</span></div>"+
        '<label><input type="checkbox" id="cpBox" '+(confirmed?"checked":"")+" data-sec=\""+esc(id)+'"/> '+esc(s.checkpoint)+"</label></div>";
    }
    h += '<div class="gfoot">'+
      (META.owner?("Owner: "+esc(META.owner)+" · "):"")+
      (META.last_reviewed?("Last reviewed: "+esc(META.last_reviewed)+" · "):"")+
      (META.authoritative_sources && META.authoritative_sources.length ?
        ("Authoritative sources: "+META.authoritative_sources.map(esc).join(" · ")+"<br/>"):"")+
      esc(META.disclaimer||"")+"</div></article>";
    return h;
  }
  function renderGuide(route){
    var cur = route.section;
    var h = bgfxHtml()+appbar(route)+'<div class="guide"><aside class="side">'+progressHtml()+
      '<div class="scat">'+esc(GUIDE.title||"Steps")+'</div><nav class="tree">'+treeHtml(GUIDE.tree, cur)+"</nav>";
    if(GUIDE.practical_guides && GUIDE.practical_guides.length){
      h += '<div class="scat">Practical guides</div><nav class="tree">'+treeHtml(GUIDE.practical_guides, cur)+"</nav>";
    }
    h += '<a class="backwhy" href="'+location.pathname+'" id="backWhy">‹ Back to Why '+esc(META.app)+"</a></aside>";
    var ix = ORDER.indexOf(cur), prev = ix>0?ORDER[ix-1]:null, next = ix<ORDER.length-1?ORDER[ix+1]:null;
    function plabel(id){ var s = GUIDE.sections[id]; return s ? s.title : id; }
    h += '<main class="gmain">'+sectionHtml(cur,false)+
      '<div class="pager">'+
      '<button id="pgPrev" '+(prev?"":"disabled")+'><span class="pk">‹ Previous</span>'+(prev?esc(plabel(prev)):"—")+"</button>"+
      '<button id="pgNext" '+(next?"":"disabled")+' style="text-align:right"><span class="pk">Next ›</span>'+(next?esc(plabel(next)):"—")+"</button>"+
      "</div></main></div>";
    root.innerHTML = h;
    wireAppbar(route);
    wireTabs();
    document.getElementById("backWhy").onclick = function(e){ e.preventDefault(); nav("why"); };
    Array.prototype.forEach.call(root.querySelectorAll(".titem"), function(b){
      b.onclick = function(){ nav("guide", b.getAttribute("data-sec")); };
    });
    Array.prototype.forEach.call(root.querySelectorAll(".tgroup>.thead"), function(b){
      b.onclick = function(){
        var g = b.parentElement; g.classList.toggle("open");
        var open = g.classList.contains("open");
        b.querySelector(".tw").innerHTML = ico(open ? "minus" : "plus");
        b.setAttribute("aria-expanded", open ? "true" : "false");
      };
    });
    var cp = document.getElementById("cpBox");
    if(cp) cp.onchange = function(){ setDone(cp.getAttribute("data-sec"), cp.checked); render(); };
    if(prev) document.getElementById("pgPrev").onclick = function(){ nav("guide", prev); };
    if(next) document.getElementById("pgNext").onclick = function(){ nav("guide", next); };
  }

  /* ---------- print all sections ---------- */
  function printAll(){
    var saved = root.innerHTML;
    root.innerHTML = '<div class="gmain">'+ORDER.map(function(id){ return sectionHtml(id,true); }).join("")+"</div>";
    window.print();
    root.innerHTML = saved;
    render();
  }

  /* ---------- boot ---------- */
  function render(){
    var r = currentRoute();
    document.title = esc(META.app)+" — Onboarding";
    if(whySpy){ whySpy.disconnect(); whySpy = null; }
    if(whyAnim){ whyAnim.disconnect(); whyAnim = null; }
    if(r.view==="guide" && GUIDE) renderGuide(r); else renderWhy();
  }
  applyTheme();
  initTheme();
  setFavicon();
  render();
})();
</script>
</body>
</html>
